#
# Hyprland 0.55+ (hyprlang legado — ainda funciona, mas será descontinuado)
# Novas opções só aparecem em hyprland.lua; veja https://hypr.land/news/update55/

source = ~/.config/hypr/startup.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/windowrule.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/mocha.conf


# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

# Configuração de monitores
# Formato: monitor=<nome>,<resolução>,<posição>,<escala>,<transform>,<opções_extras>
# nome:        DP-1, HDMI-A-1, eDP-1, etc.
# resolução:   1920x1080@60, preferred, highrr, highres, maxwidth, etc.
# posição:     0x0, 1920x0, auto
# escala:      1, 1.25, 1.5, auto
# transform:   0, 1, 2, 3 (0°, 90°, 180°, 270°)
# opções:      bitdepth,10 | vrr,0/1/2 | cm,auto/true/false | icc,/caminho/perfil.icc (0.55+)

monitor=DP-1,1920x1080@60.00,0x0,1,bitdepth,10
monitor=HDMI-A-2,1920x1080@74.97,1920x0,1,bitdepth,10

# Exemplos comentados:
# monitor=DP-1,1920x1080@60,1920x0,1,bitdepth,10
# monitor=HDMI-A-2,preferred,auto,1
# monitor=,preferred,auto,auto   # fallback para monitores não listados
# monitor=DP-1,1920x1080@144,0x0,1,vrr,2   # VRR forçado (0=off, 1=on, 2=fullscreen only)


# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░

input {
    # Layout do teclado (XKB): us, br, de, etc.
    kb_layout = br

    # Foco do mouse — estilo macOS: clique para focar (0), não hover (1/2)
    # 0 = foco só ao clicar | 1 = foco segue janela ativa | 2 = foco em qualquer janela sob o cursor
    follow_mouse = 0

    # Não trocar foco ao mover o mouse entre janelas (comportamento macOS)
    mouse_refocus = false

    # Sensibilidade do ponteiro: -1.0 a 1.0 (0 = padrão do sistema)
    sensitivity = 1

    # Desativa aceleração do mouse (1 = linear, estilo macOS/trackpad preciso)
    force_no_accel = 1

    # Perfil de aceleração: flat (linear) | adaptive (acelera com velocidade)
    accel_profile = flat

    # Repetição de teclas: taxa (cps) e atraso inicial (ms)
    repeat_rate = 50
    repeat_delay = 300

    # Rolagem natural: conteúdo segue o gesto (true = estilo macOS)
    natural_scroll = true

    # Opções extras (descomente se precisar):
    # kb_variant = abnt2          # variante do layout (ex: abnt2 para BR)
    # kb_options = compose:ralt   # teclas extras (caps:swapescape, etc.)
    # kb_model =                  # modelo do teclado
    # kb_rules =                  # regras XKB customizadas
    numlock_by_default = true     # numlock ligado ao iniciar
    # left_handed = false         # troca botões do mouse
    # scroll_method = 2fg         # 2fg | no_scroll | on_button_down
    # scroll_button = 274         # botão usado para scroll (código evdev)
    # scroll_factor = 1.0         # multiplicador de rolagem
    # follow_mouse_threshold = 0  # pixels mínimos para follow_mouse=2
    # float_switch_override_focus = 0  # 0|1|2 — foco ao alternar janelas flutuantes
    # special_fallthrough = false # passa input através do special workspace
    # off_window_axis_events = 0  # 0=none, 1=mouse, 2=keyboard, 3=both (fora da janela)
    # emulate_discrete_scroll = 0 # emula scroll discreto (0=off, 1=on, 2=on+força)
    # touchpad:...                # opções específicas de touchpad (gestos 0.55+)
}


# █▀▀ █▀▀ █▄░█ █▀▀ █▀█ ▄▀█ █░░
# █▄█ ██▄ █░▀█ ██▄ █▀▄ █▀█ █▄▄

general {
    # Espaçamento entre janelas (estilo macOS: mais respiro com tudo flutuante)
    gaps_in = 8
    gaps_out = 16

    # Borda das janelas (px). macOS usa bordas sutis
    border_size = 1

    # Cores das bordas: rgba(...) ou gradiente com ângulo (45deg)
    col.active_border = rgba(e5b9c6ff) rgba(c293a3ff) 45deg
    col.inactive_border = rgba(382D2Eff)

    # Layout padrão quando uma janela NÃO é flutuante: dwindle | master | scrolling (0.55+)
    layout = dwindle

    # Permite tearing (menos input lag em fullscreen/jogos; pode causar tearing visual)
    allow_tearing = true

    # Redimensionar janelas pela borda (estilo macOS — arrastar bordas)
    resize_on_border = true

    # Área extra (px) para agarrar a borda ao redimensionar
    extend_border_grab_area = 20

    # Opções extras (descomente se precisar):
    # gaps_out = 16 16 16 16       # gaps por lado (top right bottom left)
    # gaps_in = 8 8 8 8
    # no_focus_fallback = false      # foca janela anterior se a atual sumir
    # no_cursor_warps = true         # impede warp do cursor ao focar
    #cursor_inactive_timeout = 1    # segundos para ocultar cursor (0 = nunca)
    # snap {
    #     enabled = true             # snapping magnético entre janelas (0.55+)
    #     window_gap = 4
    #     monitor_gap = 4
    #     border_overlap = false
    # }
}


# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄

misc {
    # Remove logo e splash do Hyprland ao iniciar
    disable_hyprland_logo = false
    disable_splash_rendering = false

    # Liga monitor ao mover mouse (false = economia de energia)
    mouse_move_enables_dpms = true

    # Segue janela durante drag-and-drop entre apps
    always_follow_on_dnd = true

    # VRR/FreeSync/G-Sync: 0=off, 1=on, 2=só fullscreen, 3=fullscreen + unfocused
    vrr = 1

    # Anima redimensionamento manual (suave estilo macOS)
    animate_manual_resizes = true

    # Foca janela quando app pede atenção (notificação, popup)
    focus_on_activate = true

    # Não pula foco para outro monitor só por mover o mouse
    mouse_move_focuses_monitor = false

    # Engole (substitui) terminal filho dentro do terminal pai (Ghostty, etc.)
    enable_swallow = true
    swallow_regex = ^(ghostty)$

    # Anima a janela enquanto arrasta com SUPER+clique (visual mais macOS)
    animate_mouse_windowdragging = true

    # Opções extras (descomente se precisar):
    # force_default_wallpaper = 0  # 0=off, 1=on, 2=disabled
    # disable_hyprland_qtutils_titlebar = false
    # no_direct_scanout = 0        # 0=auto, 1=force off (compatibilidade)
    # middle_click_paste = true    # colar com botão do meio
    # keybind_v2 = false           # sintaxe nova de binds
    # on_focus_under_fullscreen = 0  # 0=always, 1=only fullscreen, 2=never
    # vrr = 2                      # alternativa: VRR só em fullscreen
    #
    # REMOVIDO em 0.55 (não use):
    # vfr = 1                      # movido para debug:vfr — ver seção debug abaixo
}


# █▀▄ █▀▀ █▀▀ █▀█ █▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▄▀ ██▄ █▄▄ █▄█ █▀▄ █▀█ ░█░ █ █▄█ █░▀█

decoration {
    # Cantos arredondados (px) — macOS usa cantos bem arredondados
    rounding = 12

    # Opacidade das janelas: 0.0 (transparente) a 1.0 (opaca)
    active_opacity = 1.0
    inactive_opacity = 0.88

    # Suavização extra nas bordas arredondadas (pode causar glitches em GPUs antigas)
    # multisample_edges = true

    blur {
        # Desfoque atrás de janelas transparentes / popups
        enabled = true
        size = 8          # raio do blur (px)
        passes = 4        # qualidade (mais = melhor, mais GPU)
        ignore_opacity = true
        new_optimizations = true

        # Opções extras:
        # noise = 0.0117     # granulado no blur
        # contrast = 0.8916  # contraste do blur
        # brightness = 0.8172
        # vibrancy = 0.1696
        # vibrancy_darkness = 0.0
        # xray = false       # blur "x-ray" (vê através de janelas empilhadas)
        # popups = false     # blur em popups
        # popups_ignorealpha = 0.2
        # input_methods = true  # blur em IME/teclado virtual
        # input_methods_ignorealpha = 0.8
    }

    shadow {
        # Sombra suave estilo macOS
        enabled = true
        range = 30        # alcance da sombra (px)
        offset = 0 12     # deslocamento X Y
        color = rgba(0,0,0,0.28)
        render_power = 3  # intensidade (1-4)
        # sharp = false   # sombra nítida vs suave

        # REMOVIDO em 0.55:
        # ignore_window = true   # agora é padrão interno, não configurável
    }

    glow {
        # Brilho sutil nas bordas (novo em 0.55) — lembra o glow do macOS
        enabled = true
        color = rgba(e5b9c655)

        # Opções extras (dependem da versão):
        # color = rgba(ffffff33)
    }

    # Opções extras de decoration (descomente se precisar):
    # dim_inactive = false
    # dim_strength = 0.5
    # dim_special = 0.2
    # screen_shader = ~/.config/hypr/shaders/myshader.frag
}


# Regras para layers (waybar, rofi, lockscreen, etc.) — substituto do antigo blurls
# Sintaxe 0.55: layerrule = <efeito>, match:<prop> <valor>
# Efeitos: blur on/off, no_anim on/off, ignore_alpha 0.5, dim_around on, xray on, order N
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace lockscreen
# layerrule = no_anim on, match:namespace walker
# layerrule = ignore_alpha 0.5, match:namespace rofi


# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█

animations {
    enabled = true

    # Curva bezier estilo macOS (ease-in-out suave)
    # Formato: bezier = <nome>, x0, y0, x1, y1
    bezier = macEase, 0.25, 0.1, 0.25, 1.0

    # Formato: animation = <nome>, <on/off>, <velocidade>, <curva>, [modificador]
    # Nomes: windows, windowsIn, windowsOut, windowsMove, border, borderangle, fade, fadeDim, workspaces

    animation = windows,     1, 6, macEase, popin 7%    # abrir janela (pop-in macOS)
    animation = windowsOut,  1, 7, macEase, popin 5%    # fechar janela
    animation = windowsMove, 1, 5, macEase, slide        # mover janela flutuante
    animation = border,        1, 18, macEase
    animation = borderangle, 1, 10, macEase
    animation = fade,          1, 7, macEase
    animation = workspaces,    1, 8, macEase              # trocar workspace (Mission Control feel)

    # Outras curvas comuns (descomente para testar):
    # bezier = easeOut, 0, 0, 0.58, 1
    # bezier = easeInOut, 0.42, 0, 0.58, 1
    # animation = specialWorkspace, 1, 8, macEase, slidefade 10%
}


# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

dwindle {
    # Mantém split ao fechar janela
    preserve_split = true

    # Opções extras:
    # use_active_for_splits = true   # usa janela ativa como referência de split
    # smart_split = false            # split inteligente baseado na posição
    # split_width_multiplier = 1.0   # largura relativa do split
    # force_split = 0                # 0=off, 1=vertical, 2=horizontal
    # split_bias = 0                 # -1 a 1, bias do split
    # smart_resizing = true          # redimensiona splits adjacentes juntos
    # permanent_direction_override = false
    # single_window_aspect_ratio = 0  # força aspect ratio com 1 janela
    # single_window_aspect_ratio_tolerance = 0.1
    # precise_mouse_move = false
    #
    # REMOVIDO em 0.55:
    # pseudotile = false   # use o dispatcher: hyprctl dispatch pseudo
    # no_gaps_when_only    # removido/renomeado — ver wiki 0.55
}

master {
    # Layout master (alternativa ao dwindle) — útil se desativar float em alguma janela
    # new_status = master        # master | slave — onde novas janelas entram
    new_on_top = false           # false = estilo macOS (nova janela embaixo)
    orientation = left           # left | right | top | bottom
    # inherit_fullscreen = true
    # allow_small_split = true
    # mfact = 0.55               # proporção master/slave (0.0-1.0)
    # smart_resizing = true
    #
    # REMOVIDO em 0.55:
    # new_is_master = true
}


