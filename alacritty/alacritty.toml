[general]
import = ["themes/noctalia.toml"]


[cursor]
style = "Beam"
vi_mode_style = "Block"

[font]
size = 12

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Medium"

[font.offset]
x = 0
y = 0

[[keyboard.bindings]]
action = "ScrollLineDown"
key = "PageDown"

[[keyboard.bindings]]
action = "ScrollLineUp"
key = "PageUp"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "Space"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollLineUp"
key = "K"
mods = "Alt"

[[keyboard.bindings]]
action = "ScrollLineDown"
key = "J"
mods = "Alt"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "K"
mods = "Alt|Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "J"
mods = "Alt|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Alt"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Alt"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Equals"
mods = "Control|Alt"

[window]
opacity = 0.98

[colors.primary]
foreground = "#ffffff"
background = "#1e1e1e"
dim_foreground = "#8e8e93"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#1e1e1e"
cursor = "#0a84ff"

[colors.vi_mode_cursor]
text = "#1e1e1e"
cursor = "#0a84ff"

[colors.search.matches]
foreground = "#8e8e93"
background = "#2c2c2e"

[colors.search.focused_match]
foreground = "#ffffff"
background = "#0a84ff"

[colors.hints.start]
foreground = "#8e8e93"
background = "#1e1e1e"

[colors.hints.end]
foreground = "#636366"
background = "#1e1e1e"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#ffffff"
background = "#1e1e1e"

[colors.selection]
text = "#ffffff"
background = "#48484a"

[colors.normal]
black = "#1e1e1e"
red = "#ff453a"
green = "#30d158"
yellow = "#ff9f0a"
blue = "#0a84ff"
magenta = "#bf5af2"
cyan = "#64d2ff"
white = "#ffffff"

[colors.bright]
black = "#48484a"
red = "#ff6961"
green = "#30d158"
yellow = "#ffd60a"
blue = "#0a84ff"
magenta = "#bf5af2"
cyan = "#64d2ff"
white = "#ffffff"

[colors.dim]
black = "#48484a"
red = "#ff453a"
green = "#30d158"
yellow = "#ff9f0a"
blue = "#0a84ff"
magenta = "#bf5af2"
cyan = "#64d2ff"
white = "#8e8e93"
